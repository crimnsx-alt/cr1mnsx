    <path d="M49 15.5 C45 15.5 42 16.5 40 17.5 L41 19 C44 18 47 17.5 50 17.5 C52 17.5 53 18 54 18.5 L54.5 17 C53 16 51 15.5 49 15.5 Z" fill="#ffffff" fill-opacity="0.75"/>

