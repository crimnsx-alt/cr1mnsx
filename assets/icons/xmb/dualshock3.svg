      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#d4e4f7" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="ds3Shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <g filter="url(#ds3Shadow)">
    <!-- DualShock 3 Body Silhouette -->
    <path d="M17 19 C22 19 25 21 32 21 C39 21 42 19 47 19 C52 19 56 22 57 28 C58 34 56 46 51 51 C48 54 44 51 42 45 C40 39 37 38 32 38 C27 38 24 39 22 45 C20 51 16 54 13 51 C8 46 6 34 7 28 C8 22 12 19 17 19 Z" 
