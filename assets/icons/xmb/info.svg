<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="infoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#d4e4f7" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="infoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <g filter="url(#infoShadow)">
    <!-- Outer Circular Badge -->
    <circle cx="32" cy="32" r="21" fill="url(#infoGrad)"/>
    <!-- Inner Dark Circle Cutout -->
    <circle cx="32" cy="32" r="17.5" fill="#0b172a" fill-opacity="0.85"/>
    <!-- Stylized Lowercase 'i' in authentic PS3 typography -->
    <circle cx="32" cy="23" r="2.8" fill="url(#infoGrad)"/>
    <rect x="29.2" y="28.5" width="5.6" height="15" rx="2.5" fill="url(#infoGrad)"/>
  </g>
</svg>
