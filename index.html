<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlayStation®5 — System UI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=20261106-ps5-v12" />
  <script>
    // Immediately unregister any old Service Workers and clear stale caches
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then((regs) => {
        for (const reg of regs) reg.unregister();
      });
    }
    if ('caches' in window) {
      caches.keys().then((keys) => keys.forEach((k) => caches.delete(k)));
    }
  </script>
</head>
<body>
  <!-- ========================================================================
       PS5 1:1 VIEWPORT STAGE
       Supports all 3 reference screens with 100% pixel-accurate geometry:
       1. Welcome Hub (EN Topographic Reference)
       2. Центр приветствия (RU Cherry Blossom Reference)
       3. Explore — Meet the family (PS5 Hardware Reference)
       ======================================================================== -->
  <div class="ps5-stage" id="ps5Stage" data-screen="welcome-en">

    <!-- Background Layer -->
    <div class="ps5-bg-layer">
      <div class="ps5-bg-img is-active" id="bgWelcomeEn" style="background-image: url('assets/ps5ish/crops/ps5-welcome-bg.png');"></div>
      <div class="ps5-bg-img" id="bgWelcomeRu" style="background-image: url('assets/ps5ish/ps5-welcome-ru-ref.jpg');"></div>
      <div class="ps5-bg-img" id="bgExplore" style="background-image: url('assets/ps5ish/ps5-explore-ref.jpg');"></div>
      <canvas id="ps5Particles" class="ps5-particles"></canvas>
    </div>

    <!-- ======================================================================
         SCREEN 1: WELCOME HUB (Dark Topographic PS5 Reference 1:1)
         ====================================================================== -->
    <section class="ps5-view ps5-view--welcome-en" id="viewWelcomeEn">
      <!-- Top System Bar -->
      <header class="ps5-topbar">
        <nav class="ps5-nav-tabs" aria-label="Categories">
          <button class="ps5-tab is-active" data-switch-screen="welcome-en" type="button">Games</button>
          <button class="ps5-tab" data-switch-screen="explore" type="button">Media</button>
        </nav>

        <div class="ps5-status-right">
          <button class="ps5-top-icon" data-switch-screen="explore" type="button" title="Search / Explore">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round">
              <circle cx="10.5" cy="10.5" r="6.2"></circle>
              <line x1="15.2" y1="15.2" x2="20.5" y2="20.5"></line>
            </svg>
          </button>
          <button class="ps5-top-icon" data-switch-screen="welcome-ru" type="button" title="Switch to RU Центр приветствия">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="#ffffff">
              <path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/>
            </svg>
          </button>
          <button class="ps5-top-icon" data-open-modal="psn" type="button" title="cr1mnsx Profile">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <rect x="2" y="2" width="20" height="20" rx="5" fill="#ffffff"/>
              <circle cx="8.8" cy="10" r="1.4" fill="#0b0d17"/>
              <circle cx="15.2" cy="10" r="1.4" fill="#0b0d17"/>
              <path d="M8.2 14.2c1 1.5 2.3 2.2 3.8 2.2s2.8-.7 3.8-2.2" fill="none" stroke="#0b0d17" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </button>
          <time class="ps5-clock">10:24AM</time>
        </div>
      </header>

      <!-- Exact 9-Tile Game Ribbon from Reference 1 -->
      <div class="ps5-ribbon-en">
        <button class="ps5-r-tile ps5-r-tile--peek" data-switch-screen="explore" type="button" aria-label="PlayStation Plus">
          <img src="assets/ps5ish/crops/tile-psplus.png" alt="" />
        </button>
        <button class="ps5-r-tile" data-switch-screen="explore" type="button" aria-label="PlayStation Store">
          <img src="assets/ps5ish/crops/tile-store.png" alt="PlayStation Store" />
          <span class="ps5-r-label">PlayStation Store</span>
        </button>
        <button class="ps5-r-tile is-selected" data-switch-screen="welcome-en" type="button" aria-label="Welcome">
          <img src="assets/ps5ish/crops/tile-welcome.png" alt="Welcome" />
          <span class="ps5-r-label">Welcome</span>
        </button>
        <button class="ps5-r-tile" data-switch-screen="explore" type="button" aria-label="Uncharted">
          <img src="assets/ps5ish/crops/tile-uncharted.png" alt="Uncharted" />
          <span class="ps5-r-label">UNCHARTED: Legacy of Thieves Collection</span>
        </button>
        <button class="ps5-r-tile" data-switch-screen="explore" type="button" aria-label="ASTRO BOT">
          <img src="assets/ps5ish/crops/tile-astrobot.png" alt="ASTRO BOT" />
          <span class="ps5-r-label">ASTRO BOT</span>
        </button>
        <button class="ps5-r-tile" data-switch-screen="explore" type="button" aria-label="ASTRO's PLAYROOM">
          <img src="assets/ps5ish/crops/tile-astro-playroom.png" alt="ASTRO's PLAYROOM" />
          <span class="ps5-r-label">ASTRO's PLAYROOM</span>
        </button>
        <button class="ps5-r-tile" data-switch-screen="explore" type="button" aria-label="The Last of Us Part II Remastered">
          <img src="assets/ps5ish/crops/tile-tlou2.png" alt="The Last of Us Part II Remastered" />
          <span class="ps5-r-label">The Last of Us™ Part II Remastered</span>
        </button>
        <button class="ps5-r-tile" data-switch-screen="welcome-ru" type="button" aria-label="PS Remote Play">
          <img src="assets/ps5ish/crops/tile-remoteplay.png" alt="PS Remote Play" />
          <span class="ps5-r-label">PS Remote Play</span>
        </button>
        <button class="ps5-r-tile" data-open-modal="psn" type="button" aria-label="Game Library">
          <img src="assets/ps5ish/crops/tile-library.png" alt="Game Library" />
          <span class="ps5-r-label">Game Library</span>
        </button>
      </div>

      <!-- Left "<" Arrow -->
      <button class="ps5-left-arrow" data-switch-screen="welcome-ru" type="button" aria-label="Previous View">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>

      <!-- Exact 1:1 Welcome Hub Bento Cards -->
      <div class="ps5-bento-en">
        <!-- Col 1: Online Friends + PlayStation Store (Horizon Forbidden West) -->
        <div class="ps5-bento-col">
          <button class="ps5-card-btn ps5-card-btn--friends" data-open-modal="psn" type="button">
            <img src="assets/ps5ish/crops/card-friends-full.png" alt="Online Friends — 4" />
          </button>
          <button class="ps5-card-btn ps5-card-btn--store" data-switch-screen="explore" type="button">
            <img src="assets/ps5ish/crops/card-horizon-store.png" alt="PlayStation Store — Horizon Forbidden West" />
          </button>
        </div>

        <!-- Col 2: Accessibility + Trophies (with real 3D Platinum/Gold/Silver/Bronze cups) -->
        <div class="ps5-bento-col">
          <button class="ps5-card-btn ps5-card-btn--acc" data-switch-screen="welcome-ru" type="button">
            <img src="assets/ps5ish/crops/card-accessibility-full.png" alt="Accessibility" />
          </button>
          <button class="ps5-card-btn ps5-card-btn--trophies" data-open-modal="psn" type="button">
            <img src="assets/ps5ish/crops/card-trophies-full.png" alt="Trophies — Total: 380" />
          </button>
        </div>

        <!-- Col 3: DualSense/Earbuds Battery Rings + Wishlist (Gran Turismo 7) -->
        <div class="ps5-bento-col">
          <button class="ps5-card-btn ps5-card-btn--battery" data-switch-screen="welcome-ru" type="button">
            <img src="assets/ps5ish/crops/card-battery-full.png" alt="Controller & Earbuds Battery" />
          </button>
          <button class="ps5-card-btn ps5-card-btn--wishlist" data-switch-screen="explore" type="button">
            <img src="assets/ps5ish/crops/card-gt7-wishlist.png" alt="Wishlist — Gran Turismo 7" />
          </button>
        </div>

        <!-- Col 4: Right-edge Peeking Card (Friend Activity / Nanami with ">" chevron) -->
        <div class="ps5-bento-col ps5-bento-col--peek">
          <button class="ps5-card-btn ps5-card-btn--peek" data-switch-screen="explore" type="button">
            <img src="assets/ps5ish/crops/card-friend-activity.png" alt="Friend Activity — Nanami" />
          </button>
        </div>
      </div>
    </section>

    <!-- ======================================================================
         SCREEN 2: ЦЕНТР ПРИВЕТСТВИЯ (RU Cherry Blossom PS5 Reference 1:1)
         ====================================================================== -->
    <section class="ps5-view ps5-view--welcome-ru" id="viewWelcomeRu" hidden>
      <!-- Invisible interactive hotspots aligned 1:1 over the RU PS5 Reference -->
      <div class="ps5-ru-topbar-hotspots">
        <button class="ps5-hotspot" style="left: 4.5%; top: 3%; width: 32%; height: 7%;" data-switch-screen="welcome-en" type="button" title="Switch to EN Welcome Hub"></button>
        <button class="ps5-hotspot" style="left: 71%; top: 3%; width: 25%; height: 7%;" data-open-modal="psn" type="button" title="Open cr1mnsx Profile"></button>
      </div>

      <div class="ps5-ru-ribbon-hotspots">
        <button class="ps5-hotspot" style="left: 8.8%; top: 11.5%; width: 8.8%; height: 15.5%;" data-switch-screen="welcome-en" type="button" title="Центр приветствия"></button>
        <button class="ps5-hotspot" style="left: 18.4%; top: 11.5%; width: 42%; height: 10.5%;" data-switch-screen="explore" type="button" title="Перейти к Explore / Играм"></button>
      </div>

      <div class="ps5-ru-cards-hotspots">
        <button class="ps5-hotspot" style="left: 8.9%; top: 48.5%; width: 26.6%; height: 14.2%;" data-open-modal="psn" type="button" title="Беспроводной контроллер DualSense"></button>
        <button class="ps5-hotspot" style="left: 8.9%; top: 64.5%; width: 26.6%; height: 14.2%;" data-open-modal="psn" type="button" title="Память консоли — 34,37 ГБ"></button>
        <button class="ps5-hotspot" style="left: 36.9%; top: 64.5%; width: 26.6%; height: 14.2%;" data-open-modal="psn" type="button" title="Призы — Всего: 2273 (cr1mnsx: 709)"></button>
        <button class="ps5-hotspot" style="left: 64.7%; top: 48.5%; width: 26.6%; height: 14.2%;" data-switch-screen="welcome-en" type="button" title="Специальные возможности"></button>
      </div>
    </section>

    <!-- ======================================================================
         SCREEN 3: EXPLORE — MEET THE FAMILY (PS5 Hardware Reference 1:1)
         ====================================================================== -->
    <section class="ps5-view ps5-view--explore" id="viewExplore" hidden>
      <!-- Top Bar Hotspots -->
      <button class="ps5-hotspot" style="left: 3.5%; top: 2.5%; width: 18%; height: 6.5%;" data-switch-screen="welcome-en" type="button" title="Back to Welcome Hub"></button>
      <button class="ps5-hotspot" style="left: 69%; top: 2.5%; width: 28%; height: 6.5%;" data-open-modal="brawl" type="button" title="Open Live Brawl Stars & PSN Stats"></button>

      <!-- Ribbon Hotspots -->
      <button class="ps5-hotspot" style="left: 1.5%; top: 10.5%; width: 6%; height: 10.5%;" data-switch-screen="welcome-en" type="button" title="PlayStation Store / Welcome"></button>
      <button class="ps5-hotspot" style="left: 7.8%; top: 10.5%; width: 9.4%; height: 16.5%;" data-switch-screen="welcome-en" type="button" title="Explore -> Welcome Hub"></button>
      <button class="ps5-hotspot" style="left: 17.8%; top: 10.5%; width: 54%; height: 10.5%;" data-switch-screen="welcome-ru" type="button" title="Switch to RU Центр приветствия"></button>

      <!-- Bottom 5 Media Cards Hotspots -->
      <button class="ps5-hotspot" style="left: 8.1%; top: 77.2%; width: 19.7%; height: 19.6%;" data-open-modal="psn" type="button" title="Meet the family"></button>
      <button class="ps5-hotspot" style="left: 29.4%; top: 77.2%; width: 19.7%; height: 19.6%;" data-open-modal="brawl" type="button" title="Welcome to London"></button>
      <button class="ps5-hotspot" style="left: 50.7%; top: 77.2%; width: 19.7%; height: 19.6%;" data-open-modal="psn" type="button" title="PS5 console details revealed"></button>
      <button class="ps5-hotspot" style="left: 72.0%; top: 77.2%; width: 19.7%; height: 19.6%;" data-open-modal="brawl" type="button" title="Announcement Trailer"></button>
    </section>

    <!-- ======================================================================
         MODAL DRAWER FOR CR1MNSX LIVE PSN & BRAWL STARS TELEMETRY
         ====================================================================== -->
    <div class="ps5-modal-backdrop" id="ps5ModalBackdrop" hidden>
      <div class="ps5-modal-card" role="dialog" aria-modal="true" aria-labelledby="ps5ModalTitle">
        <header class="ps5-modal-header">
          <div>
            <span class="ps5-modal-kicker" id="ps5ModalKicker">PLAYSTATION®5 SYSTEM TELEMETRY</span>
            <h2 class="ps5-modal-title" id="ps5ModalTitle">cr1mnsx — Live Account Overview</h2>
          </div>
          <div class="ps5-modal-actions">
            <button class="ps5-modal-switch" data-modal-switch="welcome-en" type="button">EN Welcome</button>
            <button class="ps5-modal-switch" data-modal-switch="welcome-ru" type="button">RU Центр</button>
            <button class="ps5-modal-switch" data-modal-switch="explore" type="button">PS5 Explore</button>
            <button class="ps5-modal-close" id="ps5ModalClose" type="button">✕</button>
          </div>
        </header>
        <div class="ps5-modal-body" id="ps5ModalBody"></div>
      </div>
    </div>

  </div>

  <script src="js/main.js?v=20261106-ps5-v12"></script>
</body>
</html>
